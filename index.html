<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login - Toko Buku Online</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main>
        <div class="card login-container">
            <h2>Login Toko Buku</h2>
            <form onsubmit="prosesLogin(event)">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn" style="width: 100%;">Login</button>
            </form>
            <br>
            <button class="btn btn-secondary" onclick="openModal('modalLupa')">Lupa Password</button>
            <button class="btn btn-secondary" onclick="openModal('modalDaftar')">Daftar</button>
        </div>

        <!-- Modal Lupa Password -->
        <div id="modalLupa" class="modal">
            <div class="modal-content">
                <span class="close-btn" onclick="closeModal('modalLupa')">&times;</span>
                <h3>Lupa Password</h3>
                <p>Masukkan email anda untuk reset password.</p>
                <div class="form-group">
                    <input type="email" placeholder="Email anda">
                </div>
                <button class="btn" onclick="alert('Instruksi reset telah dikirim ke email!'); closeModal('modalLupa');">Kirim</button>
            </div>
        </div>

        <!-- Modal Daftar -->
        <div id="modalDaftar" class="modal">
            <div class="modal-content">
                <span class="close-btn" onclick="closeModal('modalDaftar')">&times;</span>
                <h3>Daftar Akun Baru</h3>
                <div class="form-group">
                    <label>Nama</label>
                    <input type="text">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email">
                </div>
                <button class="btn" onclick="alert('Pendaftaran Berhasil!'); closeModal('modalDaftar');">Daftar</button>
            </div>
        </div>
    </main>
    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
